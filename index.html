<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexto EPIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <header class="laranja">
        <span class="logo-texto">Vexto EPIS</span>
    </header>

    <div class="conteudo-principal">
       
        <h1 class="titulo">Retirar equipamento</h1> 
        
        <div class="moldura-video">
            <div class="video-placeholder">
                
                
                <div class="titulo-interno">SIGA OS PASSOS ABAIXO! </div>
                
              
                <div class="passo-card passo-ativo">
                    <span class="passo-titulo">1. ENTRAR NO SISTEMA</span>
                    <img src="../FOTOS/perfil.png" alt="Ícone Perfil" class="passo-img perfil">
                </div>

                <div class="seta-indicadora">&rarr;</div>

                
                <div class="passo-card">
                    <span class="passo-titulo">2. ESCOLHER EQUIPAMENTO</span>
                    <img src="../FOTOS/epi.png" alt="Selecione Equipamentos" class="passo-img equipamentos">
                </div>

                <div class="seta-indicadora">&rarr;</div>

               
                <div class="passo-card">
                    <span class="passo-titulo">3. PEGAR EQUIPAMENTO</span>
                    <img src="../FOTOS/carrinho.png" alt="Retire EPI" class="passo-img carrinho">
                </div>

            </div>
        </div>

        
        <div class="container-botoes">
            <a href="escolhaUsuario.html" onclick="sessionStorage.setItem('tipoUsuario', 'aluno')">
                <button id="btn-avancar">CLIQUE AQUI PARA COMEÇAR</button>
            </a>
        </div>
    </div>
</body>
</html>
